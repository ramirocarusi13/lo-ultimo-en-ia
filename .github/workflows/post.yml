name: Publicar noticia de IA

on:
  schedule:
    # 3 posts por día (hora UTC): 9:17, 15:17 y 21:17 en Argentina (UTC-3)
    - cron: "17 12 * * *"
    - cron: "17 18 * * *"
    - cron: "17 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Buscar noticia y generar carrusel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
        run: python src/main.py generate

      - name: Subir imágenes al repo (URL pública para Instagram)
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add posts state
          git diff --cached --quiet || (git commit -m "Nuevo post $(date -u +%F-%H%M)" && git push)

      - name: Publicar en Instagram
        if: ${{ hashFiles('posts/pending.json') != '' && vars.AUTO_PUBLISH == 'true' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
        run: |
          sleep 20
          python src/main.py publish
          git add posts
          git diff --cached --quiet || (git commit -m "Publicado" && git push)
